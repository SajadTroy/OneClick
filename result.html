<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenshot Result</title>
    <link rel="stylesheet" href="result.css">
    <script src="lib/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Screenshot Ready!</h1>
            <p>Your full-page screenshot has been captured successfully.</p>
            <div class="actions">
                <button id="download-png" class="btn btn-primary">
                    <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16.004V17a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-1M12 4.5v11m3.5-3.5L12 15.5 8.5 12"/></svg>
                    Download PNG
                </button>
                <button id="download-pdf" class="btn btn-secondary">
                    <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9.478 3H7.25A2.25 2.25 0 0 0 5 5.25v13.5A2.25 2.25 0 0 0 7.25 21h9a2.25 2.25 0 0 0 2.25-2.25V12M9.478 3c1.243 0 2.272 1.007 2.272 2.25V7.5A2.25 2.25 0 0 0 14 9.75h2.25A2.25 2.25 0 0 1 18.5 12M9.478 3c3.69 0 9.022 5.36 9.022 9M9 16.5h6m-6-3h4"/></svg>
                    Download PDF
                </button>
                <a id="donate-btn" href="https://buymeacoffee.com/sajadtroy" target="_blank" class="bmc-btn-link">
                    <img src="icons/bmc-button.svg" alt="Buy Me A Coffee" style="height: 44px; border-radius: 8px;">
                </a>
            </div>
        </header>

        <div class="preview-container">
            <div id="loading" class="loading">Stitching images...</div>
            <canvas id="result-canvas"></canvas>
        </div>
    </div>
    <script src="result.js"></script>
</body>
</html>
