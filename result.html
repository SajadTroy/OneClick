<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenshot Result</title>
    <link rel="stylesheet" href="result.css">
    <script src="lib/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="app-layout">
        <header class="toolbar">
            <div class="toolbar-left">
                <div class="brand-icon"><img src="icons/icon48.png" alt="OneClick"></div>
                <span class="brand-name">Web Page Screenshot</span>
                <span class="badge" id="dimensions"></span>
            </div>

            <div class="toolbar-right">
                <div class="zoom-group">
                    <div class="zoom-pct">
                        <span id="zoom-value">100%</span>
                    </div>
                    <input type="range" id="zoom-slider" min="10" max="100" value="100" class="zoom-slider">
                </div>

                <div class="separator"></div>

                <button class="btn-icon" id="copy-btn">
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20.829 12.861c.171-.413.171-.938.171-1.986s0-1.573-.171-1.986a2.25 2.25 0 0 0-1.218-1.218c-.413-.171-.938-.171-1.986-.171H11.1c-1.26 0-1.89 0-2.371.245a2.25 2.25 0 0 0-.984.984C7.5 9.209 7.5 9.839 7.5 11.1v6.525c0 1.048 0 1.573.171 1.986.229.551.667.99 1.218 1.218.413.171.938.171 1.986.171s1.573 0 1.986-.171m7.968-7.968a2.25 2.25 0 0 1-1.218 1.218c-.413.171-.938.171-1.986.171s-1.573 0-1.986.171a2.25 2.25 0 0 0-1.218 1.218c-.171.413-.171.938-.171 1.986s0 1.573-.171 1.986a2.25 2.25 0 0 1-1.218 1.218m7.968-7.968a11.68 11.68 0 0 1-7.75 7.9l-.218.068M16.5 7.5v-.9c0-1.26 0-1.89-.245-2.371a2.25 2.25 0 0 0-.983-.984C14.79 3 14.16 3 12.9 3H6.6c-1.26 0-1.89 0-2.371.245a2.25 2.25 0 0 0-.984.984C3 4.709 3 5.339 3 6.6v6.3c0 1.26 0 1.89.245 2.371.216.424.56.768.984.984.48.245 1.111.245 2.372.245H7.5"/></svg>
                    <span>Copy</span>
                </button>

                <div class="separator"></div>

                <button class="btn-icon btn-primary" id="download-png">
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16.004V17a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-1M12 4.5v11m3.5-3.5L12 15.5 8.5 12"/></svg>
                    <span>Download PNG</span>
                </button>

                <button class="btn-icon btn-secondary" id="download-pdf">
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16.004V17a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-1M12 4.5v11m3.5-3.5L12 15.5 8.5 12"/></svg>
                    <span>Download PDF</span>
                </button>

                <div class="separator"></div>

                <a href="https://chromewebstore.google.com/detail/mbidegmnoegnpnohaadaokdndnhcdkcg/reviews" target="_blank" class="btn-icon" id="review-btn">
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5z"/></svg>
                    <span>Write a Review</span>
                </a>

                <a id="donate-btn" href="https://buymeacoffee.com/sajadtroy" target="_blank" class="bmc-link">
                    <img src="icons/bmc-button.svg" alt="Buy Me A Coffee">
                </a>

            </div>
        </header>

        <div class="workspace" id="workspace">
            <div class="loading-overlay" id="loading">
                <div class="loading-spinner"></div>
                <div class="loading-text">Stitching images...</div>
            </div>
            <div class="canvas-wrap" id="canvas-wrap">
                <canvas id="result-canvas"></canvas>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="result.js"></script>
</body>
</html>
