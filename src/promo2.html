<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      width: 1280px;
      height: 800px;
      background: radial-gradient(circle at 50% 30%, #1e293b, #0f172a);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      display: flex;
      width: 100%;
      height: 100%;
      padding: 0;
      align-items: center;
      justify-content: center;
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 35px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 96px;
      font-weight: 800;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #60a5fa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
    }

    h2 {
      margin: 0 0 15px 0;
      font-size: 36px;
      font-weight: 500;
      color: #cbd5e1;
      line-height: 1.4;
      max-width: 900px;
    }

    .features {
      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: stretch;
      width: 680px;
      margin: 0 auto;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 32px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.05);
      padding: 20px 30px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
      text-align: left;
    }

    .feature span.emoji {
      font-size: 36px;
      background: rgba(255, 255, 255, 0.1);
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.05);
      line-height: 1;
    }
    
    .feature span.text {
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <h1>OneClick Screenshot</h1>
      <h2>The ultimate tool to capture and stitch perfect full-page webpages.</h2>
      
      <div class="features">
        <div class="feature">
          <span class="emoji">✨</span>
          <span class="text">Full-Page & Inner-Scroll Capture</span>
        </div>
        <div class="feature">
          <span class="emoji">✂️</span>
          <span class="text">Flawless Horizontal Stitching</span>
        </div>
        <div class="feature">
          <span class="emoji">📸</span>
          <span class="text">High-Fidelity PDF & PNG Exports</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
