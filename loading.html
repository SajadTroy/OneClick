<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--card-bg);
      color: var(--text-main);
      margin: 0;
      padding: 1.5rem;
      width: 260px;
      text-align: center;
    }
    .icon {
      background: #dbeafe;
      color: #3b82f6;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 0.75rem;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2.5px solid #bfdbfe;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.1rem;
      margin: 0 0 0.5rem;
      font-weight: 600;
    }
    p {
      color: var(--text-muted);
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="icon">
    <div class="spinner" id="spinner"></div>
  </div>
  <h1>Capturing Page</h1>
  <p id="status">Preparing capture...</p>
  <script src="loading.js"></script>
</body>
</html>
