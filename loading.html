<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @font-face { font-family: 'Inter'; font-weight: 400; font-style: normal; font-display: swap; src: url('fonts/Inter-Regular.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-weight: 600; font-style: normal; font-display: swap; src: url('fonts/Inter-SemiBold.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-weight: 700; font-style: normal; font-display: swap; src: url('fonts/Inter-Bold.woff2') format('woff2'); }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 280px;
      overflow: hidden;
      background: #f0f4ff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      margin: 0;
      padding: 0;
    }

    .popup-root { 
      width: 280px; 
      background: #f0f4ff; 
      position: relative; 
      overflow: hidden; 
    }

    .brand {
      position: relative; z-index: 2;
      display: flex; align-items: center; gap: 8px;
      padding: 14px 16px 10px;
    }
    .brand-icon { width: 24px; height: 24px; flex-shrink: 0; }
    .brand-icon img { width: 100%; height: 100%; object-fit: contain; }
    .brand-name { font-size: 12px; font-weight: 700; color: #111; letter-spacing: -0.01em; }

    .capture-area {
      position: relative; z-index: 2;
      display: flex; flex-direction: column; align-items: center;
      gap: 14px; padding: 16px 16px 24px;
    }

    .pulse-icon {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(59, 130, 246, 0.1);
      border: 1.5px solid #3b82f6;
      display: flex; align-items: center; justify-content: center;
      animation: pulse-ring 1.5s ease-in-out infinite;
    }
    .pulse-icon svg { width: 18px; height: 18px; stroke: #3b82f6; }
    @keyframes pulse-ring {
      0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.3); }
      50% { box-shadow: 0 0 0 8px rgba(59, 130, 246, 0); }
    }

    .capture-text { font-size: 12px; font-weight: 700; color: #111; }
    .capture-sub { font-size: 11px; color: #64748b; font-weight: 500; }

    .progress-bar {
      width: 200px; height: 10px;
      background: #e2e8f0; border-radius: 10px;
      border: 1px solid #3b82f6;
      position: relative; overflow: hidden;
    }
    #pb-fill {
      position: absolute; top: 0; left: 0; height: 100%;
      width: 2%; border-radius: 5px;
      background: repeating-linear-gradient(45deg, #3b82f6 0 30px, #60a5fa 0 40px) right / 200% 100%;
      animation: stripe 1s linear infinite;
      transition: width 0.35s ease;
    }
    @keyframes stripe {
      0%, 20%, 40%, 60%, 80%, 100% { background: repeating-linear-gradient(45deg, #3b82f6 0 30px, #60a5fa 0 40px) right / 200% 100%; }
      10%, 30%, 50%, 70%, 90% { background: repeating-linear-gradient(45deg, #3b82f6 0 30px, #60a5fa 0 40px, rgba(255,255,255,0.3) 0 40px) right / 200% 100%; }
    }
  </style>
</head>
<body>
  <div class="popup-root">


    <div class="brand">
      <div class="brand-icon"><img src="icons/icon48.png" alt="OneClick"></div>
      <span class="brand-name">Web Page Screenshot</span>
    </div>

    <div class="capture-area">
      <div class="pulse-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15.75v-7.5a2 2 0 0 1 2-2h8.5a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2m17.168-8.759-4 3.563a.5.5 0 0 0-.168.373v1.778a.5.5 0 0 0 .168.373l4 3.563a.5.5 0 0 0 .832-.374V7.365a.5.5 0 0 0-.832-.374"/></svg>
      </div>
      <div class="capture-text" id="status">Preparing capture...</div>
      <div class="progress-bar"><div id="pb-fill"></div></div>
      <div class="capture-sub" id="pct-text">0%</div>
    </div>
  </div>
  <script src="loading.js"></script>
</body>
</html>
