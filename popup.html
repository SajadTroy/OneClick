<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @font-face { font-family: 'Inter'; font-weight: 400; font-style: normal; font-display: swap; src: url('fonts/Inter-Regular.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-weight: 500; font-style: normal; font-display: swap; src: url('fonts/Inter-Medium.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-weight: 600; font-style: normal; font-display: swap; src: url('fonts/Inter-SemiBold.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-weight: 700; font-style: normal; font-display: swap; src: url('fonts/Inter-Bold.woff2') format('woff2'); }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 280px;
      overflow: hidden;
      background: white;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      margin: 0;
      padding: 0;
    }

    .popup-root { 
      width: 280px; 
      background: white; 
      position: relative; 
      overflow: hidden; 
    }

    .brand {
      position: relative; z-index: 2;
      display: flex; align-items: center; gap: 8px;
      padding: 14px 16px 10px;
    }
    .brand-icon { width: 24px; height: 24px; flex-shrink: 0; }
    .brand-icon img { width: 100%; height: 100%; object-fit: contain; }
    .brand-name { font-size: 12px; font-weight: 700; color: #111; letter-spacing: -0.01em; min-width: 0; flex: 1; }
    
    .version-badge {
      margin-left: auto;
      height: 22px;
      padding: 0 8px;
      border: 1px solid rgba(245, 85, 148, 0.22);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.58);
      color: #F55594;
      display: inline-flex;
      align-items: center;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .chooser { position: relative; z-index: 2; padding: 0 12px 12px; display: flex; flex-direction: column; gap: 6px; }
    .mode-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(245, 85, 148, 0.15);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, transform 0.08s ease;
      font-family: inherit;
      width: 100%;
      text-align: left;
    }
    .mode-row:hover {
      background: rgba(245, 85, 148, 0.06);
      border-color: rgba(245, 85, 148, 0.4);
    }
    .mode-row:active { transform: scale(0.98); }
    .mode-icon {
      width: 32px; height: 32px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: #F55594;
      background: rgba(245, 85, 148, 0.08);
      border-radius: 8px;
    }
    .mode-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .mode-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
    .mode-title { font-size: 12px; font-weight: 600; color: #111; letter-spacing: -0.01em; }
    .mode-sub { font-size: 10px; font-weight: 500; color: #666; }

  </style>
</head>
<body>
  <div class="popup-root">


    <div class="brand">
      <div class="brand-icon"><img src="icons/icon48.png" alt="OneClick"></div>
      <span class="brand-name">Web Page Screenshot</span>
      <span class="version-badge" id="ext-version"></span>
    </div>

    <div class="chooser" id="state-chooser">
      <button class="mode-row" data-mode="visible" type="button">
        <span class="mode-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20h3m3 0h-3m0 0v-3m0 0h7a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2z"/></svg>
        </span>
        <span class="mode-text">
          <span class="mode-title">Visible Area</span>
          <span class="mode-sub">Capture what's on screen</span>
        </span>
      </button>

      <button class="mode-row" data-mode="snip" type="button">
        <span class="mode-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.6 3v9.6c0 1.68 0 2.52.327 3.162a3 3 0 0 0 1.311 1.311c.642.327 1.482.327 3.162.327H21"/><path d="M9.2 6.6h3.4c1.68 0 2.52 0 3.162.327a3 3 0 0 1 1.311 1.311c.327.642.327 1.482.327 3.162v3.4M6.6 6.6H3M17.4 21v-3.6"/></svg>
        </span>
        <span class="mode-text">
          <span class="mode-title">Snip & Capture</span>
          <span class="mode-sub">Drag to select region</span>
        </span>
      </button>

      <button class="mode-row" data-mode="fullpage" type="button">
        <span class="mode-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.728 3H7.5a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h9a2.25 2.25 0 0 0 2.25-2.25V12M9.728 3C10.971 3 12 4.007 12 5.25V7.5a2.25 2.25 0 0 0 2.25 2.25h2.25A2.25 2.25 0 0 1 18.75 12M9.728 3c3.69 0 9.022 5.36 9.022 9"/></svg>
        </span>
        <span class="mode-text">
          <span class="mode-title">Full Page</span>
          <span class="mode-sub">Scroll & capture entire page</span>
        </span>
      </button>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
